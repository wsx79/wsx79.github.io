<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="color-scheme" content="dark only">
<title>IRON WOD · Guida</title>
<meta name="description" content="Guida completa a IRON WOD: timer, WOD a intervalli, scansione lavagna, Smart WOD, benchmark, massimali, History Pro, Iron Coach, cardio, Chromecast e backup.">
<link rel="icon" href="../iron_wod_logo.png">
<style>
  :root {
    --bg: #0b0b0d;
    --surface: #151518;
    --surface-2: #1d1d21;
    --border: #2a2a30;
    --orange: #ff6a00;
    --orange-soft: #ff8a3d;
    --blue: #3b82f6;
    --green: #51d88a;
    --red: #ff5d5d;
    --text: #f7f7f8;
    --muted: #a8a8b0;
    color-scheme: dark only;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 72px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  a { color: var(--orange-soft); }

  /* top bar */
  .bar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(11, 11, 13, .92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .bar-inner {
    max-width: 1080px; margin: 0 auto; padding: 10px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-weight: 900; letter-spacing: .02em; }
  .brand img { width: 32px; height: 32px; border-radius: 8px; }
  .brand b { color: var(--orange); }
  .spacer { flex: 1; }
  .langs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
  .langs button {
    background: none; border: 0; color: var(--muted); font: inherit; font-weight: 800; font-size: 13px;
    padding: 5px 10px; border-radius: 7px; cursor: pointer;
  }
  .langs button[aria-pressed="true"] { background: var(--orange); color: #000; }

  /* hero */
  header.hero { max-width: 1080px; margin: 0 auto; padding: 48px 16px 24px; }
  .hero h1 { font-size: clamp(2.1rem, 6vw, 3.4rem); line-height: 1.05; margin: 0 0 12px; font-weight: 900; }
  .hero h1 span { color: var(--orange); }
  .hero p.lead { color: var(--muted); font-size: 1.15rem; max-width: 720px; margin: 0 0 22px; }
  .hero p.version { color: var(--muted); font-size: .9rem; margin: -10px 0 22px; }
  .cta { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 800;
    padding: 12px 18px; border-radius: 12px; border: 1px solid var(--border); color: var(--text); background: var(--surface);
  }
  .btn.primary { background: var(--orange); color: #000; border-color: var(--orange); }

  /* index */
  nav.toc { max-width: 1080px; margin: 0 auto; padding: 8px 16px 8px; }
  .toc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 8px; }
  .toc a {
    display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: 14px;
  }
  .toc a:hover { border-color: var(--orange); }
  .num {
    flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
    background: rgba(255, 106, 0, .15); color: var(--orange); font-weight: 900; font-size: 12px;
  }

  /* sections */
  main { max-width: 1080px; margin: 0 auto; padding: 8px 16px 64px; }
  section.s { border-top: 1px solid var(--border); padding: 40px 0 8px; }
  .s-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .s-head .num { width: 34px; height: 34px; font-size: 14px; border-radius: 10px; }
  .s h2 { font-size: clamp(1.4rem, 3.6vw, 1.9rem); margin: 0; font-weight: 900; }
  .s .intro { color: var(--muted); font-size: 1.05rem; margin: 6px 0 20px; max-width: 760px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
  @media (min-width: 900px) {
    .layout.with-shots { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
    .layout.with-shots .shots { position: sticky; top: 80px; }
  }
  .items { display: grid; gap: 10px; }
  .item { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .item h3 { margin: 0 0 4px; font-size: 1.02rem; font-weight: 800; }
  .item p { margin: 0; color: var(--muted); }
  .item ul { margin: 6px 0 0; padding-left: 1.2em; color: var(--muted); }
  .item li { margin: 2px 0; }
  .tag { display: inline-block; font-size: 11px; font-weight: 900; letter-spacing: .04em; padding: 2px 7px; border-radius: 6px; margin-left: 6px; vertical-align: 2px; }
  .tag.new { background: rgba(81, 216, 138, .16); color: var(--green); }
  ol.steps { list-style: none; counter-reset: step; margin: 0; padding: 0; display: grid; gap: 10px; }
  ol.steps li {
    counter-increment: step; position: relative; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px 14px 58px; color: var(--muted);
  }
  ol.steps li b { color: var(--text); }
  ol.steps li::before {
    content: counter(step); position: absolute; left: 14px; top: 13px; width: 30px; height: 30px; border-radius: 9px;
    display: grid; place-items: center; background: var(--orange); color: #000; font-weight: 900; font-size: 14px;
  }
  .tip {
    margin-top: 14px; border-left: 3px solid var(--orange); background: rgba(255, 106, 0, .08);
    padding: 10px 14px; border-radius: 0 12px 12px 0; color: var(--text);
  }
  .tip b { color: var(--orange-soft); }

  /* screenshots */
  .shots { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; }
  @media (min-width: 900px) { .shots { flex-direction: column; overflow: visible; } }
  figure.shot { margin: 0; flex: none; width: 230px; scroll-snap-align: start; }
  @media (min-width: 900px) { figure.shot { width: 100%; } }
  figure.shot img {
    display: block; width: 100%; height: auto; border-radius: 22px; border: 1px solid var(--border);
    background: var(--surface); cursor: zoom-in;
  }
  figure.shot figcaption { color: var(--muted); font-size: 13px; margin-top: 6px; text-align: center; }

  /* lightbox */
  .lb { position: fixed; inset: 0; background: rgba(0, 0, 0, .9); display: none; place-items: center; z-index: 50; padding: 16px; }
  .lb.open { display: grid; }
  .lb img { max-width: 100%; max-height: 92vh; border-radius: 18px; }

  footer { border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; }
  footer .in { max-width: 1080px; margin: 0 auto; padding: 24px 16px 40px; display: flex; flex-wrap: wrap; gap: 8px 20px; }
  footer a { color: var(--muted); }
</style>
</head>

<script>
// Every text of the page, per language. Sections render from SECTIONS below.
const UI = {
  heroTitle: { it: 'Tutto quello che fa <span>IRON WOD</span>', en: 'Everything <span>IRON WOD</span> does', es: 'Todo lo que hace <span>IRON WOD</span>' },
  heroLead: {
    it: 'Timer per il cross training, WOD a intervalli, scansione della lavagna, benchmark, massimali, analisi e un coach che legge i tuoi dati. Senza account: i tuoi allenamenti restano sul tuo telefono.',
    en: 'Cross-training timers, interval WODs, whiteboard scanning, benchmarks, max lifts, analytics and a coach that reads your data. No account: your training stays on your phone.',
    es: 'Temporizadores de cross training, WOD por intervalos, escaneo de la pizarra, benchmarks, máximos, análisis y un coach que lee tus datos. Sin cuenta: tus entrenamientos se quedan en tu teléfono.'

  ctaPlay: { it: 'Scarica su Google Play', en: 'Get it on Google Play', es: 'Descárgala en Google Play' },
  ctaStart: { it: 'Inizia a leggere ↓', en: 'Start reading ↓', es: 'Empieza a leer ↓' },
  fAbout: { it: 'Informazioni', en: 'About', es: 'Información' },
  fPrivacy: { it: 'Privacy', en: 'Privacy', es: 'Privacidad' },
  tip: { it: 'Consiglio', en: 'Tip', es: 'Consejo' }
};

const SECTIONS = [
  {
    id: 'start',
    title: { it: 'Primi passi', en: 'Getting started', es: 'Primeros pasos' },
    intro: {
      it: 'La Home si apre con la scheda <b>Oggi</b> di Iron Coach e le azioni rapide; sotto ci sono le schede (Performance, la tua settimana, i due grafici dell\'andamento, le ultime sessioni) e i pulsanti di <b>Esplora</b> verso tutte le sezioni. L\'avatar in alto a destra cambia atleta, il menu in alto a sinistra apre tutte le sezioni.',
      en: 'Home opens with Iron Coach\'s <b>Today</b> card and the quick actions; below are the cards (Performance, your week, the two trend charts, latest sessions) and the <b>Explore</b> buttons to every section. The avatar at the top right switches athlete, the menu at the top left opens every section.',
      es: 'La Home se abre con la ficha <b>Hoy</b> de Iron Coach y las acciones rápidas; debajo están las tarjetas (Performance, tu semana, los dos gráficos de evolución, las últimas sesiones) y los botones de <b>Explorar</b> hacia todas las secciones. El avatar arriba a la derecha cambia de atleta, el menú arriba a la izquierda abre todas las secciones.'
    },
    shots: [['home', { it: 'Home', en: 'Home', es: 'Home' }], ['home-weeks', { it: 'Settimane e ultime sessioni', en: 'Weeks and latest sessions', es: 'Semanas y últimas sesiones' }], ['home-explore', { it: 'Esplora', en: 'Explore', es: 'Explorar' }], ['drawer', { it: 'Menu laterale', en: 'Side menu', es: 'Menú lateral' }]],
    items: [
      { t: { it: 'Oggi e Inizia', en: 'Today and Start', es: 'Hoy y Empezar' },
        d: { it: 'La scheda arancione propone l\'allenamento del giorno. <b>Inizia</b> chiede dove ti alleni (<b>al box</b>, con <b>la tua attrezzatura</b> del profilo atleta o a <b>corpo libero</b>) e quanto tempo hai, poi genera un WOD su misura per il tuo livello e le tue skill: dai 16 minuti in su in due parti, come in una vera lezione (per esempio EMOM di forza e poi metcon). È pronto da avviare o modificare. L\'ultima scelta viene ricordata. <b>Scegli un WOD</b> apre invece la libreria. Dalla stessa scheda fai il check-in del giorno: dopo vedi la tua prontezza a colori e una frase del coach, e il WOD si adatta a come stai.', en: 'The orange card suggests today\'s workout. <b>Start</b> asks where you train (<b>at the box</b>, with <b>your equipment</b> from the athlete profile or <b>bodyweight</b>) and how much time you have, then generates a WOD tailored to your level and skills: from 16 minutes in two parts, like a real class (for example a strength EMOM, then a metcon). It\'s ready to start or edit. Your last choice is remembered. <b>Pick a WOD</b> opens the library instead. The same card has the daily check-in: afterwards it shows your readiness in color and a coach line, and the WOD adapts to how you feel.', es: 'La ficha naranja propone el entrenamiento del día. <b>Empezar</b> pregunta dónde entrenas (<b>en el box</b>, con <b>tu material</b> del perfil de atleta o con <b>peso corporal</b>) y cuánto tiempo tienes, y genera un WOD a medida de tu nivel y tus skills: desde 16 minutos en dos partes, como en una clase real (por ejemplo EMOM de fuerza y luego metcon). Está listo para iniciar o editar. Se recuerda la última elección. <b>Elegir un WOD</b> abre en cambio la biblioteca. En la misma ficha haces el check-in del día: después ves tu preparación en colores y una frase del coach, y el WOD se adapta a cómo estás.' } },
      { t: { it: 'Settimana e Iron Score', en: 'Week and Iron Score', es: 'Semana e Iron Score' },
        d: { it: 'La settimana da lunedì a domenica con i giorni allenati spuntati, i giorni di fila, le sessioni e i minuti. L\'Iron Score riassume costanza ed esperienza: i livelli più alti arrivano solo con mesi di allenamento.', en: 'The week from Monday to Sunday with trained days ticked, your streak, sessions and minutes. The Iron Score sums up consistency and experience: the top levels only come with months of training.', es: 'La semana de lunes a domingo con los días entrenados marcados, los días seguidos, las sesiones y los minutos. El Iron Score resume constancia y experiencia: los niveles más altos solo llegan con meses de entrenamiento.' } },
      { t: { it: 'Azioni rapide', en: 'Quick actions', es: 'Acciones rápidas' },
        d: { it: 'Quattro scorciatoie personalizzabili verso le sezioni che usi di più (Timer, History Pro, Esercizi, Massimali…).', en: 'Four customizable shortcuts to the sections you use most (Timers, History Pro, Exercises, Max lifts…).', es: 'Cuatro accesos directos personalizables a las secciones que más usas (Timers, History Pro, Ejercicios, Máximos…).' } },
      { t: { it: 'Progressi e percorso', en: 'Progress and journey', es: 'Progreso y recorrido' },
        d: { it: 'Più in basso due grafici: gli <b>ultimi 30 giorni</b> (giorni attivi, tempo totale e confronto con i 30 giorni prima) e le <b>ultime N settimane</b>, da lunedì a domenica e solo da quando hai iniziato ad allenarti (al massimo 12): una colonna per settimana con i giorni di allenamento, la data del lunedì sotto ("questa" per quella in corso) e la linea della tua media. Se nel profilo hai un <b>obiettivo settimanale</b>, sotto il titolo vedi a che punto sei questa settimana.', en: 'Further down, two charts: the <b>last 30 days</b> (active days, total time and comparison with the 30 days before) and the <b>last N weeks</b>, Monday to Sunday and only since you started training (12 at most): one column per week with your training days, the Monday\'s date below ("this" for the current one) and a line at your average. If your profile has a <b>weekly target</b>, under the title you see where you stand this week.', es: 'Más abajo, dos gráficos: los <b>últimos 30 días</b> (días activos, tiempo total y comparación con los 30 días anteriores) y las <b>últimas N semanas</b>, de lunes a domingo y solo desde que empezaste a entrenar (como máximo 12): una columna por semana con los días de entrenamiento, la fecha del lunes debajo ("esta" para la actual) y la línea de tu media. Si tu perfil tiene un <b>objetivo semanal</b>, bajo el título ves cómo vas esta semana.' } },
      { t: { it: 'Ultime sessioni', en: 'Latest sessions', es: 'Últimas sesiones' },
        d: { it: 'Gli ultimi tre allenamenti: toccane uno per aprirne il dettaglio. <b>Vedi tutta la cronologia</b> apre History Pro.', en: 'Your last three workouts: tap one to open its details. <b>View full history</b> opens History Pro.', es: 'Los tres últimos entrenamientos: toca uno para abrir su detalle. <b>Ver todo el historial</b> abre History Pro.' } },
      { t: { it: 'Riordinare la Home', en: 'Rearranging the Home', es: 'Reordenar la Home' },
        d: { it: 'In Impostazioni › Generale accendi <b>Riordina la Home</b>: tieni premuta una scheda o un pulsante di Esplora e trascinalo dove vuoi, gli altri si spostano per fargli posto e il nuovo ordine si salva quando lo lasci. Un tocco li apre come sempre. <b>Ripristina Home</b> riporta tutto all\'ordine iniziale; l\'ordine è compreso nel backup.', en: 'In Settings › General turn on <b>Rearrange the Home</b>: hold a card or an Explore button and drag it wherever you like, the others move to make room and the new order is saved when you let go. A tap still opens them. <b>Reset Home</b> puts everything back in the original order; the order is included in the backup.', es: 'En Ajustes › General activa <b>Reordenar el Inicio</b>: mantén pulsada una tarjeta o un botón de Explorar y arrástralo donde quieras, los demás se apartan para dejarle sitio y el nuevo orden se guarda al soltarlo. Un toque los abre como siempre. <b>Restablecer Inicio</b> lo devuelve todo al orden inicial; el orden se incluye en la copia.' } },
      { t: { it: 'Guida della Home', en: 'Home tour', es: 'Guía del Inicio' },
        d: { it: 'Al primo avvio la Home si scurisce e illumina un elemento alla volta (Iron Coach, Esplora, profilo, menu, settimana) con un fumetto che spiega a cosa serve: <b>Avanti</b> per proseguire, <b>Salta</b> per chiudere. Per rivederla: Impostazioni › Generale › <b>Rivedi la guida della Home</b>, parte quando torni alla Home.', en: 'On first launch Home dims and highlights one element at a time (Iron Coach, Explore, profile, menu, week) with a bubble explaining what it is for: <b>Next</b> to go on, <b>Skip</b> to close. To see it again: Settings › General › <b>Replay the Home tour</b>, it starts when you go back to Home.', es: 'En el primer inicio la Home se oscurece y resalta un elemento cada vez (Iron Coach, Explorar, perfil, menú, semana) con una burbuja que explica para qué sirve: <b>Siguiente</b> para seguir, <b>Saltar</b> para cerrar. Para verla de nuevo: Ajustes › General › <b>Repetir la guía del Inicio</b>, empieza cuando vuelves a la Home.' } },
      { t: { it: 'Widget', en: 'Widget', es: 'Widget' },
        d: { it: 'Tieni premuto sulla schermata Home del telefono › Widget › IRON WOD › <b>La tua settimana</b>: i giorni in cui ti sei allenato da lunedì a domenica (oggi cerchiato), l\'avanzamento verso l\'obiettivo settimanale del profilo, l\'ultima sessione e due tasti per aprire il <b>Timer</b> o <b>Iron Coach</b>. Si aggiorna da solo quando salvi o modifichi una sessione e quando cambi atleta.', en: 'Long-press the phone\'s home screen › Widgets › IRON WOD › <b>Your week</b>: the days you trained from Monday to Sunday (today circled), progress towards the profile\'s weekly target, your last session and two buttons to open the <b>Timer</b> or <b>Iron Coach</b>. It updates by itself when you save or edit a session and when you switch athlete.', es: 'Mantén pulsada la pantalla de inicio del teléfono › Widgets › IRON WOD › <b>Tu semana</b>: los días que entrenaste de lunes a domingo (hoy con un círculo), el avance hacia el objetivo semanal del perfil, la última sesión y dos botones para abrir el <b>Timer</b> o <b>Iron Coach</b>. Se actualiza solo cuando guardas o editas una sesión y cuando cambias de atleta.' } },
      { t: { it: 'Lingua e terminologia', en: 'Language and terminology', es: 'Idioma y terminología' },
        d: { it: 'Italiano, inglese e spagnolo. I nomi ufficiali del cross training (Thruster, Muscle-Up, For Time…) restano in inglese in tutte le lingue, come in palestra.', en: 'Italian, English and Spanish. Official cross-training names (Thruster, Muscle-Up, For Time…) stay in English in every language, as in the box.', es: 'Italiano, inglés y español. Los nombres oficiales del cross training (Thruster, Muscle-Up, For Time…) se mantienen en inglés en todos los idiomas, como en el box.' } },
      { t: { it: 'Unità e tema', en: 'Units and theme', es: 'Unidades y tema' },
        d: { it: 'Sistema metrico (kg, km, m, cm) o imperiale (lb, mi, yd, ft, in) applicato ovunque. Tema scuro, chiaro o automatico: i timer restano sempre scuri per leggerli bene.', en: 'Metric (kg, km, m, cm) or imperial (lb, mi, yd, ft, in) everywhere. Dark, light or automatic theme: timers always stay dark so they read well.', es: 'Sistema métrico (kg, km, m, cm) o imperial (lb, mi, yd, ft, in) en toda la app. Tema oscuro, claro o automático: los temporizadores siempre quedan oscuros para leerlos bien.' } },
      { t: { it: 'Impostazioni', en: 'Settings', es: 'Ajustes' },
        d: { it: 'Dal menu, l\'ingranaggio accanto a IRON WOD. Cinque schede: <b>Generale</b> (lingua, unità, tema, azioni rapide, notifiche), <b>Timer</b> (audio, vibrazione, countdown, schermo, TV), <b>Allenamento</b> (blocchi di modifica, formula 1RM, sensori cardio), <b>Dati e backup</b> e <b>Informazioni</b>. La lente in alto cerca tra tutte le voci.', en: 'From the menu, the gear next to IRON WOD. Five tabs: <b>General</b> (language, units, theme, quick actions, notifications), <b>Timer</b> (audio, vibration, countdown, screen, TV), <b>Training</b> (editing locks, 1RM formula, heart rate sensors), <b>Data and backup</b> and <b>Information</b>. The magnifier at the top searches every setting.', es: 'Desde el menú, el engranaje junto a IRON WOD. Cinco pestañas: <b>General</b> (idioma, unidades, tema, acciones rápidas, notificaciones), <b>Timer</b> (audio, vibración, cuenta atrás, pantalla, TV), <b>Entrenamiento</b> (bloqueos de edición, fórmula 1RM, sensores cardio), <b>Datos y copia</b> e <b>Información</b>. La lupa de arriba busca entre todos los ajustes.' } },
      { t: { it: 'Nessun account', en: 'No account', es: 'Sin cuenta' },
        d: { it: 'L\'app funziona offline e non ha un server: tutti i dati restano sul telefono. Il backup su Google Drive è facoltativo: ogni atleta lo fa sul proprio account, in uno spazio privato del suo Drive.', en: 'The app works offline and has no server: all data stays on the phone. Google Drive backup is optional: each athlete backs up to their own account, in a private area of their Drive.', es: 'La app funciona sin conexión y no tiene servidor: todos los datos se quedan en el teléfono. La copia en Google Drive es opcional: cada atleta la hace en su propia cuenta, en un espacio privado de su Drive.' } }
    ]
  },
  {
    id: 'timers',
    title: { it: 'Timer', en: 'Timers', es: 'Temporizadores' },
    intro: {
      it: 'Otto timer liberi, pronti in un tocco: AMRAP, EMOM, Tabata, Intervals, Intervalli manuali, For Time, Countdown e Count Up. Gli stessi motori fanno girare anche i WOD salvati, e il pannello è lo stesso sul telefono, sulla TV via HDMI e sul Chromecast.',
      en: 'Eight free timers ready in one tap: AMRAP, EMOM, Tabata, Intervals, Manual intervals, For Time, Countdown and Count Up. The same engines also run your saved WODs, and the board is the same on the phone, on the TV via HDMI and on Chromecast.',
      es: 'Ocho temporizadores libres listos en un toque: AMRAP, EMOM, Tabata, Intervals, Intervalos manuales, For Time, Countdown y Count Up. Los mismos motores ejecutan también tus WOD guardados, y el panel es el mismo en el teléfono, en la TV por HDMI y en Chromecast.'
    },
    shots: [['timers', { it: 'Scelta del timer', en: 'Choosing a timer', es: 'Elegir el temporizador' }], ['timer-setup', { it: 'Configurazione con i preset', en: 'Setup with presets', es: 'Configuración con presets' }], ['timer-run', { it: 'Timer in corso', en: 'Timer running', es: 'Temporizador en marcha' }], ['timer-landscape', { it: 'In orizzontale', en: 'In landscape', es: 'En horizontal' }], ['settings-timer', { it: 'Impostazioni › Timer', en: 'Settings › Timer', es: 'Ajustes › Timer' }]],
    items: [
      { t: { it: 'I formati', en: 'The formats', es: 'Los formatos' },
        list: {
          it: ['<b>For Time</b>: cronometro con time cap facoltativo; segni i round e premi WOD TERMINATO quando hai finito.', '<b>AMRAP</b>: più round possibili nel tempo, con conteggio dei round.', '<b>EMOM</b>: ogni minuto (o ogni 2, 3… minuti) per N round.', '<b>Tabata</b>: lavoro e recupero configurabili, 20"/10" per 8 round di default.', '<b>Intervals</b> e <b>Intervalli manuali</b>: sequenze di lavoro e recupero per round, oppure lavoro libero con recupero opzionale.', '<b>Countdown</b> e <b>Count Up</b>: conto alla rovescia o cronometro puro.'],
          en: ['<b>For Time</b>: stopwatch with an optional time cap; mark rounds and tap WOD DONE when you finish.', '<b>AMRAP</b>: as many rounds as possible in the time, with a round counter.', '<b>EMOM</b>: every minute (or every 2, 3… minutes) for N rounds.', '<b>Tabata</b>: configurable work and rest, 20"/10" for 8 rounds by default.', '<b>Intervals</b> and <b>Manual intervals</b>: work/rest sequences per round, or free work with optional rest.', '<b>Countdown</b> and <b>Count Up</b>: plain countdown or stopwatch.'],
          es: ['<b>For Time</b>: cronómetro con time cap opcional; marca las rondas y pulsa WOD TERMINADO al acabar.', '<b>AMRAP</b>: máximas rondas posibles en el tiempo, con contador de rondas.', '<b>EMOM</b>: cada minuto (o cada 2, 3… minutos) durante N rondas.', '<b>Tabata</b>: trabajo y descanso configurables, 20"/10" durante 8 rondas por defecto.', '<b>Intervals</b> e <b>Intervalos manuales</b>: secuencias de trabajo y descanso por ronda, o trabajo libre con descanso opcional.', '<b>Countdown</b> y <b>Count Up</b>: cuenta atrás o cronómetro puro.']
        } },
      { t: { it: 'Configurazione e preset', en: 'Setup and presets', es: 'Configuración y presets' },
        d: { it: 'Ogni timer si apre con il pannello in anteprima e i valori più usati a portata di tocco: per esempio 1′, 1′30, 2′ e 3′ nell\'EMOM o da 8′ a 20′ nell\'AMRAP. Con − e + regoli il resto, sotto vedi la durata totale, poi <b>AVVIA</b>. Anche i WOD della libreria passano da qui, con il loro nome in alto.', en: 'Every timer opens with a preview of the board and the most used values one tap away: for example 1′, 1′30, 2′ and 3′ for EMOM or 8′ to 20′ for AMRAP. Fine-tune with − and +, check the total time below, then <b>START</b>. Library WODs go through the same screen, with their name at the top.', es: 'Cada temporizador se abre con el panel en vista previa y los valores más usados a un toque: por ejemplo 1′, 1′30, 2′ y 3′ en el EMOM o de 8′ a 20′ en el AMRAP. Con − y + ajustas el resto, debajo ves la duración total y luego <b>INICIAR</b>. Los WOD de la biblioteca pasan también por aquí, con su nombre arriba.' } },
      { t: { it: 'Il pannello', en: 'The board', es: 'El panel' },
        d: { it: 'Cifre grandi da tabellone. In alto la fase (WORK, REST, AMRAP…), a sinistra il numero rosso, grande come il timer e al centro dello spazio accanto all\'orologio: il round o l\'intervallo in corso, oppure i round completati nell\'AMRAP. La riga in basso dice per esempio <b>ROUND SU 10</b>. Nei WOD a intervalli il Rest è un blocco blu a sé, e Buy-in e Cash-out non contano come intervalli. In EMOM, Tabata, Intervalli manuali e AMRAP puoi togliere la riga in basso con <b>NASCONDI ULTIMA RIGA</b>.', en: 'Big scoreboard digits. At the top the phase (WORK, REST, AMRAP…), on the left the red number, as big as the clock and centred in the space beside it: the current round or interval, or the rounds completed in an AMRAP. The bottom row reads for example <b>ROUND OF 10</b>. In interval WODs Rest is a blue block of its own, and Buy-in and Cash-out do not count as intervals. In EMOM, Tabata, Manual intervals and AMRAP you can drop the bottom row with <b>HIDE LAST ROW</b>.', es: 'Cifras grandes de marcador. Arriba la fase (WORK, REST, AMRAP…), a la izquierda el número rojo, tan grande como el reloj y centrado en el espacio a su lado: la ronda o el intervalo en curso, o las rondas completadas en el AMRAP. La fila de abajo dice por ejemplo <b>ROUND DE 10</b>. En los WOD por intervalos el Rest es un bloque azul aparte, y Buy-in y Cash-out no cuentan como intervalos. En EMOM, Tabata, Intervalos manuales y AMRAP puedes quitar la fila de abajo con <b>OCULTAR ÚLTIMA FILA</b>.' } },
      { t: { it: 'In orizzontale', en: 'In landscape', es: 'En horizontal' },
        d: { it: 'Gira il telefono a timer avviato: il pannello passa a schermo intero, leggibile da lontano. Con <b>Orizzontale automatico</b> ci va da solo appena parte il timer.', en: 'Turn the phone once the timer is running: the board goes full screen, readable from across the room. With <b>Automatic landscape</b> it switches on its own as soon as the timer starts.', es: 'Gira el teléfono con el temporizador en marcha: el panel pasa a pantalla completa, legible desde lejos. Con <b>Horizontal automático</b> lo hace solo en cuanto arranca el temporizador.' } },
      { t: { it: 'Segnali e preparazione', en: 'Cues and preparation', es: 'Señales y preparación' },
        d: { it: 'L\'<b>Audio del timer</b> è una scelta sola: <b>Beep</b>, con i suoni classici dei box (bip corti al 3-2-1, bip lungo al via e a ogni nuovo intervallo, doppio bip al Rest, sirena a fine WOD), <b>Voce</b> (dice Vai, Work, Rest e fine allenamento) o <b>Nessuno</b>. Poi vibrazione, countdown di preparazione (3, 5 o 10 secondi) e schermo sempre acceso. Il <b>Countdown finale</b> (No, 5 o 10 secondi) negli ultimi secondi prima della fine o del time cap fa il conto alla rovescia sonoro e mostra solo i secondi, al centro del timer. Il <b>Bip sui tasti</b> suona quando metti in pausa, riprendi o segni un giro (+1/-1) e si può spegnere. Tutto sta nella scheda <b>Impostazioni › Timer</b>, divisa in Suoni e vibrazione, Avvio e fine, Schermo e TV e Chromecast, con i pulsanti di prova.', en: '<b>Timer audio</b> is a single choice: <b>Beep</b>, with the classic box sounds (short beeps on 3-2-1, a long beep at go and at every new interval, a double beep for Rest, a buzzer at the end of the WOD), <b>Voice</b> (says Go, Work, Rest and workout over) or <b>None</b>. Then vibration, preparation countdown (3, 5 or 10 seconds) and keep-screen-on. The <b>Final countdown</b> (Off, 5 or 10 seconds) counts down out loud in the last seconds before the end or the time cap and shows only the seconds, in the middle of the timer. The <b>Button beep</b> sounds when you pause, resume or mark a round (+1/-1) and can be turned off. It\'s all in the <b>Settings › Timer</b> tab, split into Sounds and vibration, Start and end, Screen and TV and Chromecast, with test buttons.', es: 'El <b>Audio del timer</b> es una sola elección: <b>Beep</b>, con los sonidos clásicos de box (pitidos cortos en el 3-2-1, pitido largo al inicio y en cada nuevo intervalo, doble pitido en el Rest, bocina al final del WOD), <b>Voz</b> (dice Vamos, Work, Rest y fin del entrenamiento) o <b>Ninguno</b>. Luego vibración, cuenta atrás de preparación (3, 5 o 10 segundos) y pantalla siempre encendida. La <b>Cuenta atrás final</b> (No, 5 o 10 segundos) en los últimos segundos antes del final o del time cap hace la cuenta atrás sonora y muestra solo los segundos, en el centro del temporizador. El <b>Pitido en los botones</b> suena al pausar, reanudar o marcar una ronda (+1/-1) y se puede desactivar. Todo está en la pestaña <b>Ajustes › Timer</b>, dividida en Sonidos y vibración, Inicio y fin, Pantalla y TV y Chromecast, con botones de prueba.' } },
      { t: { it: 'Durante il WOD', en: 'During the WOD', es: 'Durante el WOD' },
        d: { it: 'Pausa e ripresa, round segnati con un tocco, ANNULLA WOD se vuoi uscire senza salvare. Il timer sopravvive anche se lo schermo si spegne, se cambi app o se Android chiude IRON WOD per liberare memoria: riaprendo l\'app il WOD riprende da dove era, contando anche il tempo trascorso.', en: 'Pause and resume, rounds marked with one tap, CANCEL WOD to leave without saving. The timer survives the screen turning off, switching apps, or Android closing IRON WOD to free memory: reopen it and the WOD picks up where it was, counting the time that passed.', es: 'Pausa y reanudación, rondas marcadas con un toque, CANCELAR WOD para salir sin guardar. El temporizador sigue aunque se apague la pantalla, cambies de app o Android cierre IRON WOD para liberar memoria: al volver a abrir la app el WOD continúa donde estaba, contando también el tiempo transcurrido.' } },
      { t: { it: 'Salva il risultato', en: 'Save the result', es: 'Guarda el resultado' },
        d: { it: 'A fine timer l\'app propone di salvare la sessione in History Pro con nome del WOD, RX o Scaled, RPE, livello e note.', en: 'When the timer ends the app offers to save the session to History Pro with WOD name, RX or Scaled, RPE, level and notes.', es: 'Al terminar el temporizador la app propone guardar la sesión en History Pro con nombre del WOD, RX o Scaled, RPE, nivel y notas.' } }
    ]
  },
  {
    id: 'wod',
    title: { it: 'Workout ed editor a intervalli', en: 'Workouts and the interval editor', es: 'Workouts y editor por intervalos' },
    intro: {
      it: 'La libreria contiene i tuoi WOD e quelli del box. L\'editor costruisce qualunque lezione: un WOD è una sequenza di intervalli, ognuno col suo formato e i suoi esercizi.',
      en: 'The library holds your WODs and your box\'s. The editor builds any class: a WOD is a sequence of intervals, each with its own format and exercises.',
      es: 'La biblioteca contiene tus WOD y los de tu box. El editor construye cualquier clase: un WOD es una secuencia de intervalos, cada uno con su formato y sus ejercicios.'
    },
    shots: [['wod-library', { it: 'Libreria Workout', en: 'Workout library', es: 'Biblioteca Workout' }], ['wod-detail', { it: 'Un WOD in due parti', en: 'A two-part WOD', es: 'Un WOD en dos partes' }], ['wod-editor', { it: 'Editor a intervalli', en: 'Interval editor', es: 'Editor por intervalos' }]],
    items: [
      { t: { it: 'Intervalli', en: 'Intervals', es: 'Intervalos' },
        d: { it: 'Ogni intervallo è un For Time, AMRAP, EMOM o Countdown con i suoi esercizi (ripetizioni, calorie, metri, tempo, carico, note). Si aprono con un tocco, si riordinano trascinandoli e gli esercizi si spostano da un intervallo all\'altro.', en: 'Each interval is a For Time, AMRAP, EMOM or Countdown with its own exercises (reps, calories, meters, time, load, notes). Tap to open, drag to reorder, and drag exercises from one interval to another.', es: 'Cada intervalo es un For Time, AMRAP, EMOM o Countdown con sus ejercicios (repeticiones, calorías, metros, tiempo, carga, notas). Se abren con un toque, se reordenan arrastrando y los ejercicios se mueven de un intervalo a otro.' } },
      { t: { it: 'Tipo generale e time cap', en: 'General type and time cap', es: 'Tipo general y time cap' },
        d: { it: 'In cima all\'editor scegli il formato generale del WOD: gli intervalli lasciati su "Generale" lo condividono, cap compreso. Ogni intervallo For Time mostra <b style="color:var(--orange)">TC generale</b> quando usa il cap comune o <b style="color:var(--red)">TC specifico</b> quando ha il suo. Il cap generale parte dal primo intervallo che lo segue: un EMOM di tecnica prima del metcon non lo consuma.', en: 'At the top of the editor pick the WOD\'s general format: intervals left on "General" share it, cap included. Each For Time interval shows <b style="color:var(--orange)">General TC</b> when it uses the shared cap or <b style="color:var(--red)">Own TC</b> when it has its own. The general cap starts with the first interval that follows it: a technique EMOM before the metcon doesn\'t use it up.', es: 'Arriba en el editor eliges el formato general del WOD: los intervalos que quedan en "General" lo comparten, cap incluido. Cada intervalo For Time muestra <b style="color:var(--orange)">TC general</b> cuando usa el cap común o <b style="color:var(--red)">TC específico</b> cuando tiene el suyo. El cap general empieza con el primer intervalo que lo sigue: un EMOM de técnica antes del metcon no lo consume.' } },
      { t: { it: 'Riposo', en: 'Rest', es: 'Descanso' },
        d: { it: '"+ Riposo" aggiunge una scheda blu di recupero tra due intervalli, che il timer esegue come un conto alla rovescia.', en: '"+ Rest" adds a blue rest card between two intervals, run by the timer as a countdown.', es: '"+ Descanso" añade una tarjeta azul de recuperación entre dos intervalos, que el temporizador ejecuta como una cuenta atrás.' } },
      { t: { it: 'Parti: attendi il tocco per iniziare', en: 'Parts: wait for a tap to start', es: 'Partes: esperar un toque para empezar' },
        d: { it: 'Una lezione con forza o skill e poi il metcon si divide in parti: l\'intervallo con "Attendi il tocco per iniziare" apre la PARTE 2, il timer si ferma e riparte quando tocchi. L\'attesa non conta nel tempo del WOD e ogni parte ha il suo tempo nella sessione. In ogni parte gli intervalli ripartono da 1; il timer mostra PARTE 1/2, il pulsante INIZIA PARTE 2 e, se la parte ha un solo intervallo, SALTA PARTE.', en: 'A class with strength or skill and then the metcon splits into parts: the interval with "Wait for tap to start" opens PART 2, the timer stops and restarts when you tap. The wait doesn\'t count as WOD time and each part gets its own time in the session. Intervals are numbered from 1 again in every part; the timer shows PART 1/2, the START PART 2 button and, when the part has a single interval, SKIP PART.', es: 'Una clase con fuerza o skill y luego el metcon se divide en partes: el intervalo con "Esperar un toque para empezar" abre la PARTE 2, el temporizador se detiene y vuelve a arrancar cuando tocas. La espera no cuenta en el tiempo del WOD y cada parte tiene su tiempo en la sesión. En cada parte los intervalos vuelven a numerarse desde 1; el temporizador muestra PARTE 1/2, el botón EMPEZAR PARTE 2 y, si la parte tiene un solo intervalo, SALTAR PARTE.' } },
      { t: { it: 'EMOM a rotazione e AMRAP nel tempo residuo', en: 'Rotating EMOM and AMRAP in the remaining time', es: 'EMOM rotativo y AMRAP en el tiempo restante' },
        d: { it: 'Un EMOM può alternare un esercizio diverso ogni minuto. Un AMRAP può durare "il tempo che resta" del time cap generale, come nei WOD "finisci il buy-in, poi AMRAP fino a 20\'".', en: 'An EMOM can rotate a different exercise every minute. An AMRAP can last "whatever is left" of the general time cap, as in "finish the buy-in, then AMRAP until 20\'" WODs.', es: 'Un EMOM puede alternar un ejercicio distinto cada minuto. Un AMRAP puede durar "el tiempo que queda" del time cap general, como en los WOD "termina el buy-in y luego AMRAP hasta 20\'".' } },
      { t: { it: 'Il dettaglio di un WOD', en: 'A WOD\'s detail', es: 'El detalle de un WOD' },
        d: { it: 'In fondo <b>Avvia</b> fa partire il timer; sotto ci sono <b>Modifica</b>, <b>Duplica</b> ed <b>Elimina</b>. In alto, accanto al nome, le icone per condividere il WOD con un link o un QR (vedi <a href="#s-share">Condividere un WOD</a>). <b>La tua valutazione</b> è di ogni atleta: ognuno dà al WOD il suo voto.', en: 'At the bottom <b>Start</b> launches the timer; below it are <b>Edit</b>, <b>Duplicate</b> and <b>Delete</b>. At the top, next to the name, the icons to share the WOD as a link or a QR code (see <a href="#s-share">Sharing a WOD</a>). <b>Your rating</b> belongs to each athlete: everyone gives the WOD their own.', es: 'Abajo <b>Iniciar</b> arranca el temporizador; debajo están <b>Editar</b>, <b>Duplicar</b> y <b>Eliminar</b>. Arriba, junto al nombre, los iconos para compartir el WOD con un enlace o un QR (ver <a href="#s-share">Compartir un WOD</a>). <b>Tu valoración</b> es de cada atleta: cada uno da al WOD la suya.' } },
      { t: { it: 'Scheda dell\'esercizio', en: 'Exercise card', es: 'Ficha del ejercicio' },
        d: { it: 'Tieni premuto un esercizio in un WOD o in una sessione per aprirne descrizione, esecuzione e standard.', en: 'Long-press an exercise in a WOD or session to open its description, execution and standard.', es: 'Mantén pulsado un ejercicio en un WOD o una sesión para abrir su descripción, ejecución y estándar.' } }
    ]
  },
  {
    id: 'build',
    title: { it: 'Creare un WOD a mano, passo passo', en: 'Building a WOD by hand, step by step', es: 'Crear un WOD a mano, paso a paso' },
    intro: {
      it: 'Esempio reale: <b>EMOM 10\' di Hover Squat Snatch</b>, poi <b>For Time 21-15-9 / 15-12-9 / 12-9-6</b> di Power Snatch, HSPU e Toes-to-Bar con <b>1\' di recupero</b> tra una scala e l\'altra e <b>time cap 20\'</b> sulla parte For Time.',
      en: 'A real example: <b>EMOM 10\' of Hover Squat Snatch</b>, then <b>For Time 21-15-9 / 15-12-9 / 12-9-6</b> of Power Snatch, HSPU and Toes-to-Bar with <b>1\' rest</b> between ladders and a <b>20\' time cap</b> on the For Time part.',
      es: 'Un ejemplo real: <b>EMOM 10\' de Hover Squat Snatch</b>, luego <b>For Time 21-15-9 / 15-12-9 / 12-9-6</b> de Power Snatch, HSPU y Toes-to-Bar con <b>1\' de descanso</b> entre escaleras y <b>time cap de 20\'</b> en la parte For Time.'
    },
    shots: [['wod-editor-add', { it: '+ Intervallo, + Riposo, + Esercizio', en: '+ Interval, + Rest, + Exercise', es: '+ Intervalo, + Descanso, + Ejercicio' }], ['wod-interval-settings', { it: 'Impostazioni di un intervallo', en: 'Interval settings', es: 'Ajustes de un intervalo' }]],
    steps: {
      it: [
        '<b>Apri l\'editor.</b> Workout → <b>CREA NUOVO WOD</b>. Dai un nome e, se vuoi, un tag (HERO, GIRL, ENGINE…).',
        '<b>Tipo generale e time cap.</b> In cima scegli <b>TIPO: FOR TIME</b>, attiva <b>TIME CAP</b> e scrivi <b>20</b>. È il formato che condividono tutti gli intervalli lasciati su "Generale": sulla loro riga comparirà <b style="color:var(--orange)">TC generale 20 min</b>.',
        '<b>Il primo intervallo (EMOM).</b> Tocca <b>+ Intervallo</b> e aprilo. Nel menu del tipo sostituisci "Generale" con <b>EMOM</b>, imposta <b>10 round</b> (e ogni quanti secondi, se non è ogni minuto). Un intervallo con tipo proprio non usa il cap generale: se è un For Time può avere un <b style="color:var(--red)">TC specifico</b>.',
        '<b>Gli esercizi.</b> Tocca <b>+ Esercizio</b>: nasce una riga libera in fondo. Cerca il movimento nel catalogo (vanno bene anche le sigle: TTB, HSPU, BMU…), scegli ripetizioni, calorie, metri o tempo, il carico e una nota ("Speed"). Poi <b>trascinalo dentro l\'intervallo</b>. Con ⋮ lo sposti, lo duplichi o lo mandi in un altro intervallo.',
        '<b>La parte For Time.</b> Aggiungi un secondo intervallo e lascialo su <b>Generale (FOR TIME)</b>: eredita da solo il TC di 20\'. Mettici Power Snatch 21 @40 kg, HSPU 15, TTB 9.',
        '<b>Attendi il tocco tra le parti.</b> Apri l\'intervallo 2 e attiva <b>Attendi il tocco per iniziare</b>: sopra compare il separatore <b>PARTE 2</b>. Finito l\'EMOM il timer si ferma e riparte solo quando tocchi Inizia; l\'attesa non conta nel tempo del WOD e il cap di 20\' parte da qui, non dall\'inizio dell\'EMOM.',
        '<b>Il recupero tra i blocchi.</b> Tocca <b>+ Riposo</b>: arriva una scheda <b style="color:var(--blue)">blu</b> da 60 secondi: la durata si scrive in secondi, per esempio 90 per 1:30. Trascinala dopo il primo intervallo della PARTE 2. Il recupero fa parte del tempo: conta nei 20\' di cap.',
        '<b>Le altre scale.</b> Dal ⋮ dell\'intervallo della scala 21-15-9 scegli <b>Duplica</b>, cambia le ripetizioni in 15-12-9 e <b>spegni</b> "Attendi il tocco" (deve partire da solo dopo il recupero). Aggiungi un altro Riposo e un terzo intervallo 12-9-6. Dentro la PARTE 2 gli intervalli si numerano da 1: Intervallo 1, 2 e 3.',
        '<b>Controlla e salva.</b> Tieni premuto e trascina per riordinare intervalli ed esercizi. <b>SALVA WORKOUT</b> ti avvisa se un intervallo è vuoto, se un esercizio è rimasto fuori o se un nome non è nel catalogo.',
        '<b>Allenati.</b> Dal dettaglio del WOD premi <b>AVVIA WOD</b>: il timer passa da un intervallo all\'altro, si ferma sulla PARTE 2 e a fine WOD ti propone di salvare la sessione con il tempo di ogni parte.'
      ],
      en: [
        '<b>Open the editor.</b> Workout → <b>CREATE NEW WOD</b>. Give it a name and, if you like, a tag (HERO, GIRL, ENGINE…).',
        '<b>General type and time cap.</b> At the top pick <b>TYPE: FOR TIME</b>, turn on <b>TIME CAP</b> and enter <b>20</b>. Every interval left on "General" shares this format: its row will show <b style="color:var(--orange)">General TC 20 min</b>.',
        '<b>The first interval (EMOM).</b> Tap <b>+ Interval</b> and open it. In the type menu replace "General" with <b>EMOM</b> and set <b>10 rounds</b> (and every how many seconds, if not every minute). An interval with its own type doesn\'t use the general cap: a For Time one can have an <b style="color:var(--red)">Own TC</b>.',
        '<b>The exercises.</b> Tap <b>+ Exercise</b>: a loose row appears at the bottom. Search the movement in the catalog (board shorthand works too: TTB, HSPU, BMU…), set reps, calories, meters or time, the load and a note ("Speed"). Then <b>drag it into the interval</b>. With ⋮ you move it, duplicate it or send it to another interval.',
        '<b>The For Time part.</b> Add a second interval and leave it on <b>General (FOR TIME)</b>: it inherits the 20\' cap by itself. Add Power Snatch 21 @40 kg, HSPU 15, TTB 9.',
        '<b>Wait for a tap between parts.</b> Open interval 2 and turn on <b>Wait for tap to start</b>: the <b>PART 2</b> divider appears above it. After the EMOM the timer stops and restarts only when you tap Start; the wait doesn\'t count as WOD time and the 20\' cap starts here, not at the start of the EMOM.',
        '<b>Rest between blocks.</b> Tap <b>+ Rest</b>: a <b style="color:var(--blue)">blue</b> 60-second card appears: its length is in seconds, for example 90 for 1:30. Drag it after the first interval of PART 2. Rest is part of the time: it counts toward the 20\' cap.',
        '<b>The other ladders.</b> From the ⋮ of the 21-15-9 interval choose <b>Duplicate</b>, change the reps to 15-12-9 and <b>turn off</b> "Wait for tap" (it must start on its own after the rest). Add another Rest and a third interval 12-9-6. Inside PART 2 intervals are numbered from 1: Interval 1, 2 and 3.',
        '<b>Check and save.</b> Long-press and drag to reorder intervals and exercises. <b>SAVE WORKOUT</b> warns you if an interval is empty, an exercise was left outside or a name isn\'t in the catalog.',
        '<b>Train.</b> From the WOD detail tap <b>START WOD</b>: the timer moves from interval to interval, stops at PART 2 and at the end offers to save the session with the time of each part.'
      ],
      es: [
        '<b>Abre el editor.</b> Workout → <b>CREAR NUEVO WOD</b>. Ponle un nombre y, si quieres, una etiqueta (HERO, GIRL, ENGINE…).',
        '<b>Tipo general y time cap.</b> Arriba elige <b>TIPO: FOR TIME</b>, activa <b>TIME CAP</b> y escribe <b>20</b>. Es el formato que comparten todos los intervalos que queden en "General": en su fila aparecerá <b style="color:var(--orange)">TC general 20 min</b>.',
        '<b>El primer intervalo (EMOM).</b> Toca <b>+ Intervalo</b> y ábrelo. En el menú del tipo cambia "General" por <b>EMOM</b> y pon <b>10 rondas</b> (y cada cuántos segundos, si no es cada minuto). Un intervalo con tipo propio no usa el cap general: si es un For Time puede tener un <b style="color:var(--red)">TC específico</b>.',
        '<b>Los ejercicios.</b> Toca <b>+ Ejercicio</b>: aparece una fila suelta al final. Busca el movimiento en el catálogo (también valen las siglas: TTB, HSPU, BMU…), elige repeticiones, calorías, metros o tiempo, la carga y una nota ("Speed"). Luego <b>arrástralo dentro del intervalo</b>. Con ⋮ lo mueves, lo duplicas o lo mandas a otro intervalo.',
        '<b>La parte For Time.</b> Añade un segundo intervalo y déjalo en <b>General (FOR TIME)</b>: hereda solo el cap de 20\'. Pon Power Snatch 21 @40 kg, HSPU 15, TTB 9.',
        '<b>Esperar un toque entre partes.</b> Abre el intervalo 2 y activa <b>Esperar un toque para empezar</b>: encima aparece el separador <b>PARTE 2</b>. Al acabar el EMOM el temporizador se detiene y solo vuelve a arrancar cuando tocas Empezar; la espera no cuenta en el tiempo del WOD y el cap de 20\' empieza aquí, no al inicio del EMOM.',
        '<b>El descanso entre bloques.</b> Toca <b>+ Descanso</b>: aparece una tarjeta <b style="color:var(--blue)">azul</b> de 60 segundos: la duración va en segundos, por ejemplo 90 para 1:30. Arrástrala después del primer intervalo de la PARTE 2. El descanso forma parte del tiempo: cuenta en los 20\' de cap.',
        '<b>Las otras escaleras.</b> Desde el ⋮ del intervalo de la escalera 21-15-9 elige <b>Duplicar</b>, cambia las repeticiones a 15-12-9 y <b>desactiva</b> "Esperar un toque" (debe arrancar solo tras el descanso). Añade otro Descanso y un tercer intervalo 12-9-6. Dentro de la PARTE 2 los intervalos se numeran desde 1: Intervalo 1, 2 y 3.',
        '<b>Revisa y guarda.</b> Mantén pulsado y arrastra para reordenar intervalos y ejercicios. <b>GUARDAR WORKOUT</b> te avisa si un intervalo está vacío, si un ejercicio quedó fuera o si un nombre no está en el catálogo.',
        '<b>Entrena.</b> Desde el detalle del WOD pulsa <b>INICIAR WOD</b>: el temporizador pasa de un intervalo a otro, se detiene en la PARTE 2 y al final te propone guardar la sesión con el tiempo de cada parte.'
      ]
    },

    tip: {

      en: 'Faster: photograph the board with <b>From board</b>. The same WOD comes out like this already, with parts, rests and time cap; you just check and save.',
      es: 'Más rápido: fotografía la pizarra con <b>Desde pizarra</b>. El mismo WOD sale ya así, con partes, descansos y time cap; tú revisas y guardas.'

  {
    id: 'share',

    intro: {

      en: 'A WOD travels as a link or a QR code: whoever gets it opens it in IRON WOD, reviews it in the editor and saves it as their own. No account and no server: the WOD lives inside the link.',
      es: 'Un WOD se pasa con un enlace o un QR: quien lo recibe lo abre en IRON WOD, lo revisa en el editor y lo guarda entre los suyos. Sin cuenta y sin servidor: el WOD viaja dentro del enlace.'
    },
    shots: [['share-qr', { it: 'QR del WOD', en: 'WOD QR code', es: 'QR del WOD' }], ['share-link', { it: 'Il link aperto senza app', en: 'The link without the app', es: 'El enlace sin la app' }], ['share-session', { it: 'Dal dettaglio sessione', en: 'From a session', es: 'Desde una sesión' }]],
    items: [
      { t: { it: 'Condividi WOD', en: 'Share WOD', es: 'Compartir WOD' },
        d: { it: 'Nel dettaglio di un WOD tocca l\'icona di <b>condivisione</b> in alto, accanto al nome, e scegli WhatsApp, mail o un\'altra app: parte un messaggio con il nome del WOD e il link.', en: 'In a WOD\'s detail tap the <b>share</b> icon at the top, next to the name, and pick WhatsApp, email or another app: it sends a message with the WOD name and the link.', es: 'En el detalle de un WOD toca el icono de <b>compartir</b> arriba, junto al nombre, y elige WhatsApp, correo u otra app: se envía un mensaje con el nombre del WOD y el enlace.' } },
      { t: { it: 'Mostra QR', en: 'Show QR code', es: 'Mostrar QR' },
        d: { it: 'Al box, senza scambiarsi numeri: tocca l\'icona <b>QR</b> in alto e l\'altro lo inquadra con la fotocamera normale del telefono. Si apre direttamente IRON WOD con il WOD pronto.', en: 'At the box, without swapping numbers: tap the <b>QR</b> icon at the top and the other person scans it with their phone\'s normal camera. IRON WOD opens straight away with the WOD ready.', es: 'En el box, sin intercambiar números: toca el icono <b>QR</b> arriba y la otra persona lo escanea con la cámara normal del móvil. IRON WOD se abre directamente con el WOD listo.' } },
      { t: { it: 'Aprire un WOD ricevuto', en: 'Opening a WOD you received', es: 'Abrir un WOD recibido' },
        d: { it: 'Toccando il link si apre l\'editor con il WOD già compilato: intervalli, round, tempi, esercizi e carichi. Controlla, cambia quello che vuoi e salva. Chi non ha l\'app vede l\'anteprima del WOD nel browser e il link a Google Play.', en: 'Tapping the link opens the editor with the WOD already filled in: intervals, rounds, times, exercises and loads. Review it, change what you like and save. Without the app, the browser shows a preview of the WOD and the Google Play link.', es: 'Al tocar el enlace se abre el editor con el WOD ya completo: intervalos, rondas, tiempos, ejercicios y cargas. Revísalo, cambia lo que quieras y guarda. Sin la app, el navegador muestra una vista previa del WOD y el enlace a Google Play.' } },
      { t: { it: 'Dalle sessioni', en: 'From your sessions', es: 'Desde tus sesiones' },
        d: { it: 'Nel dettaglio di una sessione le stesse due icone in alto passano il WOD fatto quel giorno, anche se nel frattempo l\'hai cancellato dalla libreria. <b>Condividi risultato</b>, in fondo, manda invece il tuo risultato: un messaggio ordinato con tempo, blocchi e intervalli come li hai fatti, tempi dei round e note.', en: 'In a session\'s detail the same two icons at the top pass on the WOD you did that day, even if you have since deleted it from the library. <b>Share result</b>, at the bottom, sends your result instead: a tidy message with time, blocks and intervals as you did them, round times and notes.', es: 'En el detalle de una sesión los mismos dos iconos de arriba pasan el WOD que hiciste ese día, aunque lo hayas borrado de la biblioteca. <b>Compartir resultado</b>, abajo, envía en cambio tu resultado: un mensaje ordenado con tiempo, bloques e intervalos como los hiciste, tiempos de las rondas y notas.' } }
    ],
    tip: {
      it: 'Gli esercizi personalizzati arrivano come testo libero, perché sull\'altro telefono non esistono: chi riceve il WOD può collegarli al catalogo dall\'editor.',
      en: 'Custom exercises arrive as free text, since they don\'t exist on the other phone: the receiver can link them to the catalog from the editor.',
      es: 'Los ejercicios personalizados llegan como texto libre, porque en el otro móvil no existen: quien recibe el WOD puede vincularlos al catálogo desde el editor.'
    }

        list: {

          en: ['Formats: For Time, AMRAP, EMOM and E2MOM, "Every 2 min x 5", Tabata, rounds, time cap, work/rest.', 'Rep schemes: Fran-style "21-15-9", or several in a row ("21-15-9 / 15-12-9 / 12-9-6") with one number per exercise.', 'REST between parts, turned into blue rest cards; a REST at the end of a rounds block ("13 rounds … REST 1\'") becomes the rest of every round instead.', 'Alternatives with OR ("5/3 cal erg OR 100m run", or two whole parts): after scanning the app asks which one you do.', 'Rep ranges like "8-10": you start from the lower number and the range stays in the notes, like "Speed" or "Heavy" written next to the exercise.', 'Separate parts (A/B, Strength, Metcon, lifting before the WOD), waiting for a tap only when needed.', 'Board shorthand: TTB, HSPU, C2B, DU, KBS, WB, P.Snatch, H.S.Clean…', 'Loads "@50/35" and calories "50/40 cal": the right value for you from your profile and units.'],

    intro: {
      it: 'Un WOD su misura in un tocco, costruito sull\'attrezzatura, il livello e le skill del tuo profilo atleta.',
      en: 'A tailor-made WOD in one tap, built on the equipment, level and skills of your athlete profile.',

    },
    shots: [['smart', { it: 'Smart WOD Builder', en: 'Smart WOD Builder', es: 'Smart WOD Builder' }]],
    items: [
      { t: { it: 'Obiettivi', en: 'Goals', es: 'Objetivos' },
        d: { it: 'Resistenza, Misto, Forza, Ginnastica, Pesistica, Core e Corsa + Stazioni. Il Misto può uscire in più parti, fino a 60 minuti.', en: 'Endurance, Mixed, Strength, Gymnastics, Weightlifting, Core and Run + Stations. Mixed can come out in several parts, up to 60 minutes.', es: 'Resistencia, Mixto, Fuerza, Gimnasia, Halterofilia, Core y Carrera + Estaciones. El Mixto puede salir en varias partes, hasta 60 minutos.' } },
      { t: { it: 'Formato e durata', en: 'Format and length', es: 'Formato y duración' },
        d: { it: 'Formato automatico o scelto da te (AMRAP, EMOM, For Time…) e durata della sessione.', en: 'Automatic format or your choice (AMRAP, EMOM, For Time…) and session length.', es: 'Formato automático o elegido por ti (AMRAP, EMOM, For Time…) y duración de la sesión.' } },
      { t: { it: 'Dal profilo atleta', en: 'From your athlete profile', es: 'Desde tu perfil de atleta' },
        d: { it: 'Usa solo gli attrezzi che hai, rispetta il tuo livello e, se vuoi, solo le skill che hai già acquisito (muscle-up, HSPU…). Le <b>limitazioni</b> del profilo valgono sempre: con le ginocchia segnate niente squat, affondi e salti, con le spalle niente lavoro sopra la testa, e le note del WOD lo dicono. Il WOD generato si apre nell\'editor per ritoccarlo.', en: 'Uses only the equipment you have, respects your level and, if you want, only skills you already have (muscle-up, HSPU…). The profile\'s <b>limitations</b> always apply: with knees ticked no squats, lunges or jumps, with shoulders no overhead work, and the WOD notes say so. The generated WOD opens in the editor for tweaks.', es: 'Usa solo el material que tienes, respeta tu nivel y, si quieres, solo las skills que ya dominas (muscle-up, HSPU…). Las <b>limitaciones</b> del perfil siempre cuentan: con las rodillas marcadas nada de sentadillas, zancadas ni saltos, con los hombros nada por encima de la cabeza, y las notas del WOD lo dicen. El WOD generado se abre en el editor para retocarlo.' } },
      { t: { it: 'In più parti', en: 'In several parts', es: 'En varias partes' },
        d: { it: 'Dai 30 minuti (sempre, con il formato MISTO) il WOD esce come una lezione: forza e poi metcon, oppure due metcon. Tra una parte e l\'altra il timer aspetta il tuo tocco, così recuperi e prepari l\'attrezzatura con calma.', en: 'From 30 minutes (always, with the MIXED format) the WOD comes out like a class: strength then a metcon, or two metcons. Between parts the timer waits for your tap, so you recover and set up the equipment at your own pace.', es: 'Desde 30 minutos (siempre, con el formato MIXTO) el WOD sale como una clase: fuerza y luego metcon, o dos metcons. Entre partes el temporizador espera tu toque, así recuperas y preparas el material con calma.' } },
      { t: { it: 'Carichi suggeriti', en: 'Suggested loads', es: 'Cargas sugeridas' },
        d: { it: 'Ogni movimento con bilanciere, manubri, kettlebell, palla medica o sandbag arriva con un carico. Se hai registrato il massimale di quell\'alzata (anche su più ripetizioni) parte da lì: circa il 70% nella parte di forza e il 45% nel metcon. Altrimenti usa i carichi RX del movimento in base al sesso e al livello del profilo (pieni solo al livello RX), nelle misure reali di kettlebell e palle. Senza sesso nel profilo vedi la coppia ♀/♂. Sono un punto di partenza: cambiali pure nell\'editor.', en: 'Every barbell, dumbbell, kettlebell, med ball or sandbag movement comes with a load. If you logged a max for that lift (even a multi-rep one) it starts from there: about 70% in the strength part and 45% in the metcon. Otherwise it uses the movement\'s RX loads by your profile\'s sex and level (full RX only at the RX level), in real kettlebell and ball sizes. Without a sex in the profile you see the ♀/♂ pair. They\'re a starting point: change them in the editor.', es: 'Cada movimiento con barra, mancuernas, kettlebell, balón medicinal o sandbag llega con una carga. Si registraste el máximo de ese levantamiento (también a varias repeticiones) parte de ahí: alrededor del 70% en la parte de fuerza y del 45% en el metcon. Si no, usa las cargas RX del movimiento según el sexo y el nivel del perfil (completas solo en el nivel RX), en los tamaños reales de kettlebell y balones. Sin sexo en el perfil ves la pareja ♀/♂. Son un punto de partida: cámbialas en el editor.' } }
    ]
  },

      en: 'A catalog of about 580 cross-training exercises, each with an animated illustration of the movement, description, standard and muscles worked in Italian, English and Spanish.',
      es: 'Un catálogo de unos 580 ejercicios de cross training, cada uno con una ilustración animada de la ejecución, descripción, estándar y músculos implicados en italiano, inglés y español.'
    },
    shots: [['exercise', { it: 'Scheda esercizio', en: 'Exercise card', es: 'Ficha de ejercicio' }]],
    items: [
      { t: { it: 'Illustrazioni animate', en: 'Animated illustrations', es: 'Ilustraciones animadas' },
        d: { it: 'Aprendo un esercizio, accanto al nome una figura alterna la posizione di partenza e quella di arrivo, con l\'attrezzo giusto (bilanciere, manubri, kettlebell, box, sbarra, anelli…). I movimenti laterali sono mostrati di fronte. Se hai disattivato le animazioni del telefono resta ferma la posizione finale.', en: 'When you open an exercise, a figure next to the name alternates the start and end positions, with the right equipment (barbell, dumbbells, kettlebell, box, bar, rings…). Lateral movements are shown from the front. If your phone\'s animations are off, the end position stays still.', es: 'Al abrir un ejercicio, junto al nombre una figura alterna la posición inicial y la final, con el material correcto (barra, mancuernas, kettlebell, cajón, barra de dominadas, anillas…). Los movimientos laterales se muestran de frente. Si has desactivado las animaciones del teléfono, se queda fija la posición final.' } },

      { t: { it: 'Ricerca intelligente', en: 'Smart search', es: 'Búsqueda inteligente' },
        d: { it: 'Trova gli esercizi anche per alias e sigle da lavagna (BMU, T2B, KBS…), senza differenza tra maiuscole e minuscole, con filtri per tipo, categoria, attrezzatura e difficoltà, e i preferiti in cima.', en: 'Finds exercises by alias and board shorthand too (BMU, T2B, KBS…), whatever the case, with type, category, equipment and difficulty filters, and favorites first.', es: 'Encuentra ejercicios también por alias y siglas de pizarra (BMU, T2B, KBS…), sin importar mayúsculas o minúsculas, con filtros por tipo, categoría, material y dificultad, y los favoritos primero.' } },
      { t: { it: 'Esercizi tuoi', en: 'Your own exercises', es: 'Tus propios ejercicios' },
        d: { it: 'Aggiungi esercizi personalizzati con il pulsante <b>+</b> in basso a destra. Per i tuoi puoi indicare anche l\'<b>Intensità per ripetizione</b>, che pesa l\'esercizio sulla mappa dei muscoli: 1 = un push-up, 0,2 = una double-under, 1,9 = una strict deficit HSPU. Quelli standard sono già pesati e si possono modificare solo attivando l\'opzione apposita in Impostazioni › Allenamento.', en: 'Add custom exercises with the <b>+</b> button at the bottom right. For your own you can also set the <b>Intensity per rep</b>, which weighs the exercise on the muscle map: 1 = a push-up, 0.2 = a double-under, 1.9 = a strict deficit HSPU. Standard ones are already weighted and can be edited only after turning on the dedicated option in Settings › Training.', es: 'Añade ejercicios personalizados con el botón <b>+</b> abajo a la derecha. En los tuyos puedes indicar también la <b>Intensidad por repetición</b>, que pondera el ejercicio en el mapa muscular: 1 = un push-up, 0,2 = una double-under, 1,9 = una strict deficit HSPU. Los estándar ya están ponderados y solo se pueden editar activando la opción correspondiente en Ajustes › Entrenamiento.' } }
    ]
  },

    items: [
      { t: { it: 'Ultimo PR', en: 'Latest PR', es: 'Último PR' },
        d: { it: 'In alto il tuo ultimo record in grande, con quanto hai guadagnato e la data: toccalo per aprire l\'esercizio. Sotto, i PR fatti quest\'anno e una barra che mostra quanti esercizi hanno già un massimale.', en: 'At the top, your latest record in big type, with how much you gained and the date: tap it to open the lift. Below, the PRs set this year and a bar showing how many lifts already have a max.', es: 'Arriba, tu último récord en grande, con cuánto has ganado y la fecha: tócalo para abrir el ejercicio. Debajo, los PR de este año y una barra que muestra cuántos ejercicios ya tienen un máximo.' } },
      { t: { it: 'PR recenti e famiglie', en: 'Recent PRs and families', es: 'PR recientes y familias' },
        d: { it: 'Una striscia con gli ultimi record e quanto hai guadagnato, poi gli esercizi divisi per famiglia (Squat, Forza, Press, Jerk, Sollevamenti olimpici). Ogni riga mostra il massimale, la data, un mini-grafico del progresso e l\'ultimo guadagno; se il valore è solo stimato compare ≈. Negli esercizi ancora vuoti c\'è <b>+ Aggiungi</b>.', en: 'A strip with your latest records and how much you gained, then the lifts grouped by family (Squat, Strength, Press, Jerk, Olympic lifts). Each row shows the max, the date, a small progress chart and the last gain; a value that is only estimated shows ≈. Lifts still empty have <b>+ Add</b>.', es: 'Una franja con los últimos récords y cuánto has ganado, y luego los ejercicios agrupados por familia (Sentadilla, Fuerza, Press, Jerk, Levantamientos olímpicos). Cada fila muestra el máximo, la fecha, un minigráfico del progreso y la última mejora; un valor solo estimado muestra ≈. Los ejercicios aún vacíos tienen <b>+ Añadir</b>.' } },

      { t: { it: 'Percentuali e storico', en: 'Percentages and history', es: 'Porcentajes e historial' },

      { t: { it: 'Calcolatore dischi', en: 'Plate calculator', es: 'Calculadora de discos' },
        d: { it: 'Tocca un carico nella tabella delle percentuali, oppure l\'icona del disco in alto in Max Lifts: scegli il bilanciere (20, 15 o 10 kg; 45, 35 o 15 lb) e vedi quali dischi montare per lato, disegnati con i colori ufficiali. Se il carico non si può fare esatto con i dischi standard, ti dice il più vicino.', en: 'Tap a load in the percentage table, or the plate icon at the top of Max Lifts: pick the bar (20, 15 or 10 kg; 45, 35 or 15 lb) and see which plates go on each side, drawn in the official colours. If the load can\'t be made exactly with standard plates, it tells you the nearest one.', es: 'Toca una carga en la tabla de porcentajes, o el icono del disco arriba en Max Lifts: elige la barra (20, 15 o 10 kg; 45, 35 o 15 lb) y ves qué discos montar por lado, dibujados con los colores oficiales. Si la carga no se puede hacer exacta con los discos estándar, te dice la más cercana.' } }

    shots: [['history', { it: 'Cronologia', en: 'History', es: 'Historial' }], ['session', { it: 'Dettaglio sessione', en: 'Session detail', es: 'Detalle de sesión' }], ['session-3', { it: 'Muscoli coinvolti', en: 'Muscles worked', es: 'Músculos implicados' }]],
    items: [
      { t: { it: 'Dettaglio sessione', en: 'Session detail', es: 'Detalle de sesión' },
        d: { it: 'Struttura del WOD, tempo di ogni parte, punteggio, round, RX o Scaled, RPE, note, carichi usati e frequenza cardiaca con le zone. Gli AMRAP mostrano la durata accanto al formato ("AMRAP · 4:00") e i giri fatti: in modifica si correggono come <b>Round</b> + <b>Reps extra</b>. Il time cap generale compare una volta sola in alto; accanto a un intervallo c\'è solo se ne ha uno suo.', en: 'WOD structure, time of each part, score, rounds, RX or Scaled, RPE, notes, loads used and heart rate with zones. AMRAPs show their duration next to the format ("AMRAP · 4:00") and the rounds done: when editing you correct them as <b>Rounds</b> + <b>Extra reps</b>. The general time cap shows once at the top; next to an interval only when it has its own.', es: 'Estructura del WOD, tiempo de cada parte, puntuación, rondas, RX o Scaled, RPE, notas, cargas usadas y frecuencia cardiaca con zonas. Los AMRAP muestran la duración junto al formato ("AMRAP · 4:00") y las rondas hechas: al editar se corrigen como <b>Rondas</b> + <b>Reps extra</b>. El time cap general aparece una sola vez arriba; junto a un intervalo solo si tiene uno propio.' } },
      { t: { it: 'Muscoli coinvolti', en: 'Muscles worked', es: 'Músculos implicados' },
        d: { it: 'La mappa pesa ogni esercizio per quanto costa davvero una ripetizione: 300 double-under caricano i polpacci meno di quanto 50 strict HSPU carichino le spalle.', en: 'The map weighs each exercise by what one rep really costs: 300 double-unders load the calves less than 50 strict HSPU load the shoulders.', es: 'El mapa pondera cada ejercicio por lo que cuesta de verdad una repetición: 300 double-unders cargan los gemelos menos de lo que 50 strict HSPU cargan los hombros.' } },
      { t: { it: 'Inserimento manuale', en: 'Manual entry', es: 'Entrada manual' },
        d: { it: 'Hai fatto il WOD senza il telefono? Inseriscilo dopo, con data, ora, durata, time cap e la struttura costruita con lo stesso editor dei WOD. Nei WOD a più intervalli puoi scrivere anche il <b>tempo di ogni intervallo</b>.', en: 'Did the WOD without your phone? Add it afterwards, with date, time, duration, time cap and the structure built with the same WOD editor. In WODs with several intervals you can also enter the <b>time of each interval</b>.', es: '¿Hiciste el WOD sin el teléfono? Añádelo después, con fecha, hora, duración, time cap y la estructura hecha con el mismo editor de WOD. En los WOD con varios intervalos puedes escribir también el <b>tiempo de cada intervalo</b>.' } },
      { t: { it: 'Modifiche bloccate', en: 'Editing locked', es: 'Edición bloqueada' },
        d: { it: 'Perché i risultati restino quelli veri, aggiungere un WOD a mano e modificare una sessione già fatta sono <b>bloccati di default</b>: si sbloccano in Impostazioni › Allenamento › <b>Consenti modifica History Pro</b>. Il salvataggio a fine timer resta sempre libero.', en: 'So that results stay the real ones, adding a WOD by hand and editing a session already done are <b>locked by default</b>: unlock them in Settings › Training › <b>Allow History Pro editing</b>. Saving at the end of a timer always stays available.', es: 'Para que los resultados sigan siendo los reales, añadir un WOD a mano y editar una sesión ya hecha están <b>bloqueados por defecto</b>: se desbloquean en Ajustes › Entrenamiento › <b>Permitir editar History Pro</b>. Guardar al final del temporizador siempre está disponible.' } },

    ]

    shots: [['analytics', { it: 'Panoramica', en: 'Overview', es: 'Resumen' }], ['analytics-load', { it: 'Carico e intensità', en: 'Load and intensity', es: 'Carga e intensidad' }], ['analytics-records', { it: 'Record', en: 'Records', es: 'Récords' }], ['analytics-muscles', { it: 'Gruppi muscolari', en: 'Muscle groups', es: 'Grupos musculares' }], ['progress', { it: 'Progress Intelligence', en: 'Progress Intelligence', es: 'Progress Intelligence' }]],
    items: [
      { t: { it: 'Analytics', en: 'Analytics', es: 'Analytics' },
        d: { it: 'Cinque schede, tutto visibile senza aprire nulla. <b>Panoramica</b>: gli ultimi 30 giorni con la variazione rispetto ai 30 precedenti, le sessioni per settimana e per mese, streak e totali. <b>Muscoli</b>: gruppi allenati e trascurati. <b>Carico</b>: carico settimanale (minuti × RPE), <b>Intensità</b> con la scala RPE spiegata sulle tue sessioni, cardio e tempo nelle zone, fascia oraria e durata preferite. <b>Workout</b>: i formati con durata e RPE medi, RX e Scaled. <b>Record</b>: i tuoi primati (sessione più lunga, più ripetizioni, settimana più carica, miglior streak), il miglior risultato per ogni benchmark e il collegamento ai Massimali.', en: 'Five tabs, everything visible without opening anything. <b>Overview</b>: the last 30 days with the change from the 30 before, sessions per week and per month, streaks and totals. <b>Muscles</b>: muscle groups trained and neglected. <b>Load</b>: weekly load (minutes × RPE), <b>Intensity</b> with the RPE scale explained on your own sessions, cardio and time in zones, preferred time of day and length. <b>Workouts</b>: formats with average length and RPE, RX and Scaled. <b>Records</b>: your personal bests (longest session, most reps, biggest week, best streak), the best result for each benchmark and the link to Max Lifts.', es: 'Cinco pestañas, todo visible sin abrir nada. <b>Resumen</b>: los últimos 30 días con la variación respecto a los 30 anteriores, sesiones por semana y por mes, rachas y totales. <b>Músculos</b>: grupos trabajados y olvidados. <b>Carga</b>: carga semanal (minutos × RPE), <b>Intensidad</b> con la escala RPE explicada sobre tus sesiones, cardio y tiempo en zonas, franja horaria y duración preferidas. <b>Workouts</b>: los formatos con duración y RPE medios, RX y Scaled. <b>Récords</b>: tus mejores marcas (sesión más larga, más repeticiones, semana más cargada, mejor racha), el mejor resultado de cada benchmark y el enlace a Máximos.' } },
      { t: { it: 'Progress Intelligence', en: 'Progress Intelligence', es: 'Progress Intelligence' },
        d: { it: 'Esercizi, benchmark e massimali a confronto: frequenza settimanale, PR recenti, 1RM ed e1RM. Le variazioni percentuali compaiono solo quando c\'è davvero qualcosa da confrontare: almeno 3 sessioni nei 30 giorni precedenti e, per un esercizio, almeno 2 sessioni in entrambi i periodi. Un massimale è <b>in crescita</b> solo quando l\'ultimo record supera il migliore precedente; un set più leggero non conta come calo. Distanze e carichi seguono il sistema di unità scelto.', en: 'Exercises, benchmarks and max lifts compared: weekly frequency, recent PRs, 1RM and e1RM. Percentage changes only show when there is something real to compare: at least 3 sessions in the previous 30 days and, for an exercise, at least 2 sessions in both periods. A max lift is <b>improving</b> only when the latest record beats the previous best; a lighter set doesn\'t count as a drop. Distances and loads follow your unit system.', es: 'Ejercicios, benchmarks y máximos comparados: frecuencia semanal, PR recientes, 1RM y e1RM. Las variaciones porcentuales solo aparecen cuando hay algo real que comparar: al menos 3 sesiones en los 30 días anteriores y, para un ejercicio, al menos 2 sesiones en ambos periodos. Un máximo está <b>mejorando</b> solo cuando el último registro supera el mejor anterior; una serie más ligera no cuenta como bajada. Distancias y cargas siguen tu sistema de unidades.' } },
      { t: { it: 'Nuova FC massima', en: 'New max heart rate', es: 'Nueva FC máxima' },
        d: { it: 'Se in allenamento superi la FC massima del tuo profilo, in cima ad Analytics compare la proposta di aggiornarla, qualunque scheda tu abbia aperto: <b>Aggiorna FC massima</b> o <b>Ignora</b>. Ignorata, torna solo con un valore ancora più alto.', en: 'If you go past your profile\'s max heart rate in a workout, a proposal to update it appears at the top of Analytics, whatever tab is open: <b>Update max HR</b> or <b>Ignore</b>. Once ignored, it only comes back with an even higher value.', es: 'Si en un entrenamiento superas la FC máxima de tu perfil, arriba en Analytics aparece la propuesta de actualizarla, sea cual sea la pestaña abierta: <b>Actualizar FC máxima</b> o <b>Ignorar</b>. Si la ignoras, solo vuelve con un valor aún más alto.' } }
    ]
  },

      { t: { it: 'Iron Score', en: 'Iron Score', es: 'Iron Score' },
        d: { it: 'Indice 0-100 basato su costanza, equilibrio allenante, forza e progressi, motore e cardio, capacità di lavoro. Sale di rank man mano che ti alleni.', en: 'A 0-100 index based on consistency, training balance, strength and progress, engine and cardio, work capacity. Your rank goes up as you train.', es: 'Índice 0-100 basado en constancia, equilibrio del entrenamiento, fuerza y progreso, motor y cardio, capacidad de trabajo. Subes de rango a medida que entrenas.' } },
      { t: { it: 'Personal record', en: 'Personal records', es: 'Récords personales' },
        d: { it: 'Un PR conta solo quando migliori davvero: un benchmark rifatto più veloce (o con più ripetizioni negli AMRAP) oppure una singola più pesante nei Massimali. La prima volta che fai un benchmark è il riferimento da battere, non un record. Lo stesso conteggio vale in Iron Profile, nel tuo anno, negli achievement e in Analytics.', en: 'A PR only counts when you actually improve: a benchmark redone faster (or with more reps on an AMRAP) or a heavier single in Max Lifts. The first time you do a benchmark is the reference to beat, not a record. The same count is used in Iron Profile, your year, achievements and Analytics.', es: 'Un PR solo cuenta cuando mejoras de verdad: un benchmark repetido más rápido (o con más repeticiones en un AMRAP) o una serie única más pesada en Máximos. La primera vez que haces un benchmark es la referencia a superar, no un récord. El mismo recuento vale en Iron Profile, tu año, los logros y Analytics.' } },

    title: { it: 'Iron Coach', en: 'Iron Coach', es: 'Iron Coach' },
    intro: {
      it: 'Un coach che legge i tuoi dati reali, senza inventarli: frequenza, carico, recupero e benchmark.',

    shots: [['coach', { it: 'Oggi', en: 'Today', es: 'Hoy' }], ['coach-analysis', { it: 'Analisi', en: 'Analysis', es: 'Análisis' }]],
    items: [
      { t: { it: 'Check-in del giorno', en: 'Daily check-in', es: 'Check-in del día' },
        d: { it: 'Dieci secondi: <b>sonno</b> ed <b>energia</b> su cinque livelli, <b>dolori</b> (nessuno, leggeri, forti) con la zona (gambe, schiena, spalle e braccia, core) e la <b>voglia di spingere</b>. Ogni risposta cambia una parte diversa del WOD di oggi: sonno ed energia l\'intensità (RPE), l\'energia la durata, i dolori tolgono gli esercizi sulla zona indicata e, se forti, i carichi pesanti, la voglia sceglie il formato (EMOM controllato, AMRAP o For Time). Sotto le domande, <b>Il tuo WOD di oggi</b> ti dà una frase del coach adatta a come stai; <b>Genera il WOD</b> chiede dove ti alleni e quanto tempo hai, come Inizia in home. <b>Fatto</b>, <b>Modifica</b> e <b>Azzera</b> sono subito sotto le domande; il check-in vale per la giornata.', en: 'Ten seconds: <b>sleep</b> and <b>energy</b> on five levels, <b>soreness</b> (none, light, strong) with where (legs, back, shoulders and arms, core) and your <b>drive to push</b>. Each answer changes a different part of today\'s WOD: sleep and energy the intensity (RPE), energy the length, soreness leaves out exercises for that area and, when strong, heavy loads, drive picks the format (controlled EMOM, AMRAP or For Time). Below the questions, <b>Your WOD today</b> gives you a coach line that fits how you feel; <b>Generate the WOD</b> asks where you train and how long you have, like Start on Home. <b>Done</b>, <b>Edit</b> and <b>Reset</b> sit right under the questions; the check-in lasts for the day.', es: 'Diez segundos: <b>sueño</b> y <b>energía</b> en cinco niveles, <b>dolores</b> (ninguno, leves, fuertes) con la zona (piernas, espalda, hombros y brazos, core) y las <b>ganas de apretar</b>. Cada respuesta cambia una parte distinta del WOD de hoy: sueño y energía la intensidad (RPE), la energía la duración, los dolores quitan los ejercicios de esa zona y, si son fuertes, las cargas pesadas, las ganas eligen el formato (EMOM controlado, AMRAP o For Time). Debajo de las preguntas, <b>Tu WOD de hoy</b> te da una frase del coach según cómo estás; <b>Generar el WOD</b> pregunta dónde entrenas y cuánto tiempo tienes, como Empezar en la Home. <b>Hecho</b>, <b>Editar</b> y <b>Borrar</b> están justo debajo de las preguntas; el check-in vale para todo el día.' } },
      { t: { it: 'Oggi, Settimana, Analisi', en: 'Today, Week, Analysis', es: 'Hoy, Semana, Análisis' },
        d: { it: '<b>Oggi</b>: check-in, recupero e i punteggi (Iron Score, ultima sessione, media degli ultimi 30 giorni). <b>Settimana</b>: avanzamento, piano dei prossimi giorni e il benchmark da riprovare. <b>Analisi</b>: in cima il <b>focus consigliato</b>, l\'area che hai allenato meno negli ultimi 30 giorni, con <b>Genera SmartWOD mirato</b> che crea un WOD proprio su quell\'area (Core, Ginnastica, Forza…); sotto, l\'equilibrio tra le aree con ▲▼ rispetto al mese prima, l\'andamento degli ultimi 14 giorni e i movimenti più usati o assenti da più tempo. In fondo, una riga dice quanto è affidabile l\'analisi.', en: '<b>Today</b>: check-in, recovery and the scores (Iron Score, last session, last-30-days average). <b>Week</b>: progress, the plan for the next days and the benchmark to retest. <b>Analysis</b>: at the top the <b>recommended focus</b>, the area you trained least in the last 30 days, with <b>Generate a targeted SmartWOD</b> building a WOD right on that area (Core, Gymnastics, Strength…); below, the balance between areas with ▲▼ versus the month before, the last 14 days trend and the movements used most or missing longest. At the bottom, one line says how reliable the analysis is.', es: '<b>Hoy</b>: check-in, recuperación y las puntuaciones (Iron Score, última sesión, media de los últimos 30 días). <b>Semana</b>: progreso, plan de los próximos días y el benchmark a repetir. <b>Análisis</b>: arriba el <b>foco recomendado</b>, el área que menos has entrenado en los últimos 30 días, con <b>Generar SmartWOD específico</b> que crea un WOD justo sobre esa área (Core, Gimnasia, Fuerza…); debajo, el equilibrio entre áreas con ▲▼ respecto al mes anterior, la evolución de los últimos 14 días y los movimientos más usados o ausentes desde hace más tiempo. Al final, una línea indica lo fiable que es el análisis.' } }

const IMG_DIR = 'img/';
let lang = 'it';

function pick(obj) { return obj[lang] ?? obj.it; }

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => { el.innerHTML = pick(UI[el.dataset.i]); });
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));

  document.getElementById('toc').innerHTML = SECTIONS.map((s, i) =>
    `<a href="#s-${s.id}"><span class="num">${i + 1}</span>${pick(s.title)}</a>`).join('');

  document.getElementById('content').innerHTML = SECTIONS.map((s, i) => {
    const items = s.items.map(it => `
      <div class="item"><h3>${pick(it.t)}</h3>
        ${it.d ? `<p>${pick(it.d)}</p>` : ''}
        ${it.list ? `<ul>${pick(it.list).map(li => `<li>${li}</li>`).join('')}</ul>` : ''}
      </div>`).join('');
    const steps = s.steps ? `<ol class="steps">${pick(s.steps).map(st => `<li>${st}</li>`).join('')}</ol>` : '';
    const tip = s.tip ? `<div class="tip"><b>${pick(UI.tip)}:</b> ${pick(s.tip)}</div>` : '';
    const shots = (s.shots || []).map(([file, cap]) => `
      <figure class="shot"><img src="${IMG_DIR}${file}.webp" alt="${pick(cap)}" loading="lazy" onerror="this.closest('figure').remove()"><figcaption>${pick(cap)}</figcaption></figure>`).join('');
    return `
      <section class="s" id="s-${s.id}">
        <div class="s-head"><span class="num">${i + 1}</span><h2>${pick(s.title)}</h2></div>
        <p class="intro">${pick(s.intro)}</p>
        <div class="layout ${shots ? 'with-shots' : ''}">
          <div>${steps}${items ? `<div class="items">${items}</div>` : ''}${tip}</div>
          ${shots ? `<div class="shots">${shots}</div>` : ''}
        </div>
      </section>`;
  }).join('');
}

function setLang(next) {
  lang = ['it', 'en', 'es'].includes(next) ? next : 'en';
  try { localStorage.setItem('ironwod-guide-lang', lang); } catch (e) {}
  const url = new URL(location.href);
  url.searchParams.set('lang', lang);
  history.replaceState(null, '', url);
  render();
}

(function init() {
  let stored = null;
  try { stored = localStorage.getItem('ironwod-guide-lang'); } catch (e) {}
  const fromUrl = new URLSearchParams(location.search).get('lang');
  const fromBrowser = (navigator.language || 'it').slice(0, 2);
  lang = [fromUrl, stored, fromBrowser].find(l => ['it', 'en', 'es'].includes(l)) || 'en';
  render();
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
  document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

  const lb = document.getElementById('lb');
  document.addEventListener('click', e => {
    if (e.target.matches('figure.shot img')) { lb.querySelector('img').src = e.target.src; lb.classList.add('open'); }
    else if (e.target.closest('#lb')) lb.classList.remove('open');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('open'); });
})();
</script>
